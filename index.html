<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClawSight Test</title>
    <style>
        body { background: #121212; color: #00ffcc; text-align: center; font-family: sans-serif; padding-top: 50px; }
        button { background: #00ffcc; color: #000; font-size: 18px; padding: 15px 25px; border: none; border-radius: 8px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>ClawSight 疎通テスト</h1>
    <p id="text">ボタンを押してJSの動作を確認してくれ</p>
    <button onclick="runTest()">ここをタップ！</button>

    <script>
        function runTest() {
            document.getElementById('text').innerText = "【SUCCESS】JavaScriptが正常に動いたぜ！";
            document.getElementById('text').style.color = "#ff0055";
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ClawSight v4.5 - UFO 10 Dual-Arm</title>
    <style>
        * { box-sizing: border-box; touch-action: none; }
        body { margin: 0; overflow: hidden; background-color: #0b0b0b; font-family: sans-serif; }
        
        #ui-panel {
            position: absolute; top: 10px; left: 10px; right: 10px; z-index: 100;
            background: rgba(0, 0, 0, 0.92); padding: 12px;
            border: 1px solid #00ffcc; border-radius: 12px; color: #00ffcc;
            text-align: center; box-shadow: 0 4px 20px rgba(0,255,204,0.2);
        }
        h1 { font-size: 14px; margin: 0 0 4px 0; text-transform: uppercase; letter-spacing: 1px; }
        
        .control-row {
            display: flex; gap: 6px; margin: 4px 0; justify-content: center;
        }
        .select-btn {
            flex: 1; padding: 7px; font-size: 11px; font-weight: bold;
            background: #1a1a1a; color: #888; border: 1px solid #444; border-radius: 6px; cursor: pointer;
        }
        .select-btn.active-push { background: #ff3366; color: #fff; border-color: #ff88aa; }
        .select-btn.active-hook { background: #00ffcc; color: #000; border-color: #88ffeb; }
        .select-btn.active-power-low { background: #555; color: #fff; border-color: #777; }
        .select-btn.active-power-high { background: #ffaa00; color: #000; border-color: #ffcc55; }

        #status { font-size: 12px; font-weight: bold; color: #00ffcc; margin-top: 4px; }
        
        #controls {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            z-index: 100; width: 90%; max-width: 400px;
            display: flex; gap: 10px; justify-content: space-between;
        }
        button {
            flex: 1; padding: 15px 0; font-size: 15px; font-weight: 900;
            border: none; border-radius: 8px; cursor: pointer;
            box-shadow: 0 4px 0 rgba(0,0,0,0.6);
        }
        button:active { transform: translateY(4px); box-shadow: none; }
        #btn-drop { background: #ff3366; color: #fff; border: 2px solid #ff88aa; }
        #btn-ai-nav { background: #00ffcc; color: #000; border: 2px solid #88ffeb; }
        #btn-reset { background: #222; color: #00ffcc; border: 2px solid #00ffcc; flex: 0.5; }

        #target-ui {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.4); font-size: 11px; font-weight: bold; pointer-events: none; z-index: 50;
            text-align: center; text-shadow: 1px 1px 2px #000;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui-panel">
        <h1>ClawSight v4.5 [UFO 10 Dual-Arm]</h1>
        <div class="control-row">
            <button id="btn-push" class="select-btn active-push" onclick="setInteractionMode('PUSH')">🔴 上面を押す (PUSH)</button>
            <button id="btn-hook" class="select-btn" onclick="setInteractionMode('HOOK')">🔵 下を突く/持ち上げ (HOOK)</button>
        </div>
        <div class="control-row">
            <button id="p-low" class="select-btn active-power-low" onclick="setPowerMode('LOW')">⚙️ 設定: 日本アーム(弱)</button>
            <button id="p-high" class="select-btn" onclick="setPowerMode('HIGH')">🔥 設定: 強力(大)</button>
        </div>
        <div id="status">Status: 2点アームの照準を定めろ！</div>
    </div>

    <div id="target-ui">[ スワイプでデュアルアームを移動 ]</div>

    <div id="controls">
        <button id="btn-reset" onclick="resetSimulation()">RESET</button>
        <button id="btn-ai-nav" onclick="computeAINav()">AI NAVI</button>
        <button id="btn-drop" onclick="dropArm()">ACTION</button>
    </div>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0b0b0b);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 14, 16);
        camera.lookAt(0, -1, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        let boxGroup;
        let leftClawMesh, rightClawMesh, aiGhostGroup;
        let currentMode = 'PUSH'; 
        let powerMode = 'LOW';   
        
        let state = {
            x: 0, z: 0,       
            rotX: 0, rotZ: 0, 
            comX: 0, comZ: 0, 
            isAnimating: false,
            isFallen: false
        };

        const CLAW_SPAN = 1.2; // 左右の爪の間隔（スパン）

        function setInteractionMode(mode) {
            currentMode = mode;
            document.getElementById('btn-push').className = mode === 'PUSH' ? "select-btn active-push" : "select-btn";
            document.getElementById('btn-hook').className = mode === 'HOOK' ? "select-btn active-hook" : "select-btn";
        }

        function setPowerMode(pMode) {
            powerMode = pMode;
            document.getElementById('p-low').className = pMode === 'LOW' ? "select-btn active-power-low" : "select-btn";
            document.getElementById('p-high').className = pMode === 'HIGH' ? "select-btn active-power-high" : "select-btn";
        }

        function buildStage() {
            const barMat = new THREE.MeshStandardMaterial({ color: 0x777777, roughness: 0.3 });
            const bar1 = new THREE.Mesh(new THREE.BoxGeometry(16, 0.5, 0.5), barMat);
            bar1.position.set(0, 0, -1.8);
            scene.add(bar1);
            const bar2 = new THREE.Mesh(new THREE.BoxGeometry(16, 0.5, 0.5), barMat);
            bar2.position.set(0, 0, 1.8);
            scene.add(bar2);
        }

        function initBox() {
            if (boxGroup) scene.remove(boxGroup);

            state.x = 0;
            state.z = 0;
            state.rotX = 0;
            state.rotZ = 0;
            state.isAnimating = false;
            state.isFallen = false;

            state.comX = (Math.random() - 0.5) * 0.8;
            state.comZ = (Math.random() - 0.5) * 0.8;

            document.getElementById('status').innerText = "Status: デュアルアームで隙を狙え！";
            document.getElementById('status').style.color = "#00ffcc";

            boxGroup = new THREE.Group();
            
            // 縦置きの長方形プライズ箱
            const boxGeo = new THREE.BoxGeometry(2.0, 1.2, 4.0);
            const boxMat = new THREE.MeshStandardMaterial({ color: 0x00ffcc, roughness: 0.3, transparent: true, opacity: 1.0 });
            const mainMesh = new THREE.Mesh(boxGeo, boxMat);
            boxGroup.add(mainMesh);

            const edges = new THREE.EdgesGeometry(boxGeo);
            const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x000000 }));
            boxGroup.add(line);

            const comGeo = new THREE.SphereGeometry(0.25, 16, 16);
            const comMat = new THREE.MeshBasicMaterial({ color: 0xff0055 });
            const comMarker = new THREE.Mesh(comGeo, comMat);
            comMarker.name = "comMarker";
            comMarker.position.set(state.comX, 0, state.comZ);
            comMarker.visible = false;
            boxGroup.add(comMarker);

            boxGroup.position.set(state.x, 0.6, state.z);
            scene.add(boxGroup);

            if (aiGhostGroup) aiGhostGroup.visible = false;
        }

        function resetSimulation() {
            initBox();
        }

        // --- 【新規】左右2点の爪ポイント（デュアル・ターゲット） ---
        const clawGeo = new THREE.CircleGeometry(0.2, 32);
        
        const leftMat = new THREE.MeshBasicMaterial({ color: 0xff3366, side: THREE.DoubleSide });
        leftClawMesh = new THREE.Mesh(clawGeo, leftMat);
        leftClawMesh.rotation.x = -Math.PI / 2;
        leftClawMesh.position.set(-CLAW_SPAN/2, 0.65, 0);
        scene.add(leftClawMesh);

        const rightMat = new THREE.MeshBasicMaterial({ color: 0xff3366, side: THREE.DoubleSide });
        rightClawMesh = new THREE.Mesh(clawGeo, rightMat);
        rightClawMesh.rotation.x = -Math.PI / 2;
        rightClawMesh.position.set(CLAW_SPAN/2, 0.65, 0);
        scene.add(rightClawMesh);

        // AIゴースト（2点ペア）
        aiGhostGroup = new THREE.Group();
        const ghostMat = new THREE.MeshBasicMaterial({ color: 0x00ffcc, side: THREE.DoubleSide, transparent: true, opacity: 0.8 });
        const gLeft = new THREE.Mesh(clawGeo, ghostMat); gLeft.rotation.x = -Math.PI/2; gLeft.position.set(-CLAW_SPAN/2, 0, 0);
        const gRight = new THREE.Mesh(clawGeo, ghostMat); gRight.rotation.x = -Math.PI/2; gRight.position.set(CLAW_SPAN/2, 0, 0);
        aiGhostGroup.add(gLeft); aiGhostGroup.add(gRight);
        aiGhostGroup.position.y = 0.65;
        aiGhostGroup.visible = false;
        scene.add(aiGhostGroup);

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);

        function updateTarget(event) {
            if(event.target.tagName === 'BUTTON') return;
            let clientX = event.touches ? event.touches[0].clientX : event.clientX;
            let clientY = event.touches ? event.touches[0].clientY : event.clientY;
            
            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            const targetPos = new THREE.Vector3();
            raycaster.ray.intersectPlane(plane, targetPos);
            
            if (targetPos) {
                // センター位置をベースに、左右の爪をスパンに合わせて連動配置
                const cx = Math.max(-4.5, Math.min(4.5, targetPos.x));
                const cz = Math.max(-4.5, Math.min(4.5, targetPos.z));

                leftClawMesh.position.set(cx - CLAW_SPAN/2, 0.65, cz);
                rightClawMesh.position.set(cx + CLAW_SPAN/2, 0.65, cz);
            }
        }
        window.addEventListener('touchmove', updateTarget, {passive: false});
        window.addEventListener('mousemove', updateTarget);

        function computeAINav() {
            if (state.isFallen) return;

            // UFO 10の橋渡し攻略における最適解（奥側の角を2点同時、あるいは片効きを狙う位置）
            const bestX = state.x;
            const bestZ = state.z - 1.5;

            aiGhostGroup.position.x = bestX;
            aiGhostGroup.position.z = bestZ;
            aiGhostGroup.visible = true;

            document.getElementById('status').innerText = "🤖 AI NAVI: 緑の2点アーム位置を狙え！";
            document.getElementById('status').style.color = "#00ffcc";
        }

        function dropArm() {
            if (state.isAnimating || state.isFallen) return;

            // 左右アームの中央座標を算出
            const tx = (leftClawMesh.position.x + rightClawMesh.position.x) / 2;
            const tz = leftClawMesh.position.z;

            state.isAnimating = true;
            const powerMult = powerMode === 'LOW' ? 0.2 : 0.85; // 日本アームの「渋い設定」

            document.getElementById('status').innerText = currentMode === 'PUSH' ? 
                `Status: 2点で上面プッシュ中 (設定:${powerMode})...` : 
                `Status: 2点で下フチをフック中 (設定:${powerMode})...`;

            const leverageX = tx - (state.x + state.comX);
            const leverageZ = tz - (state.z + state.comZ);

            let targetX, targetZ, targetRotX, targetRotZ;

            if (currentMode === 'PUSH') {
                targetX = state.x + leverageX * 0.2 * powerMult;
                targetZ = state.z + leverageZ * 0.25 * powerMult;
                targetRotX = leverageZ * 0.25 * powerMult;
                targetRotZ = -leverageX * 0.25 * powerMult;
            } else {
                // HOOK（下を突く）：2点支持のバランスにより、左右どちらかに偏ると片効き回転が起きる
                targetX = state.x + leverageX * 0.35 * powerMult;
                targetZ = state.z + leverageZ * 0.45 * powerMult;
                targetRotX = leverageZ * 0.55 * powerMult;
                targetRotZ = -leverageX * 0.55 * powerMult;
            }

            let progress = 0;
            const animateStep = () => {
                progress += 0.07;
                if (progress < 1.0) {
                    state.x += (targetX - state.x) * 0.25;
                    state.z += (targetZ - state.z) * 0.25;
                    state.rotX += (targetRotX - state.rotX) * 0.25;
                    state.rotZ += (targetRotZ - state.rotZ) * 0.25;

                    boxGroup.position.set(state.x, 0.6, state.z);
                    boxGroup.rotation.set(state.rotX, 0, state.rotZ);
                    requestAnimationFrame(animateStep);
                } else {
                    const distZMax = Math.abs(state.z) + 2.0;
                    const distZMin = Math.abs(state.z) - 2.0;
                    const isDropped = (distZMin < -1.8 || distZMax > 1.8 || Math.abs(state.rotX) > 0.35);

                    if (isDropped) {
                        triggerFall();
                    } else {
                        state.isAnimating = false;
                        document.getElementById('status').innerText = "Status: 渋い！ 耐えられた。次の手を！";
                    }
                }
            };
            animateStep();
        }

        function triggerFall() {
            state.isFallen = true;
            document.getElementById('status').innerText = "🎉 攻略成功！ 景品GET！";
            document.getElementById('status').style.color = "#ff3366";

            let fallProgress = 0;
            const fallAnim = () => {
                fallProgress += 0.05;
                state.y = 0.6 - fallProgress * 2.5;
                boxGroup.position.y = state.y;
                boxGroup.rotation.x += 0.08;

                if (fallProgress < 1.0) {
                    requestAnimationFrame(fallAnim);
                } else {
                    boxGroup.children[0].material.opacity = 0.4;
                    const com = boxGroup.getObjectByName("comMarker");
                    if (com) com.visible = true; 
                }
            };
            fallAnim();
        }

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        buildStage();
        initBox();
        animate();
    </script>
</body>
</html>

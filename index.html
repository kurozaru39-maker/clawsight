<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ClawSight v6.0 - Pro Module Core</title>
    <style>
        /* CSSはUIシェルとして最低限のレイアウトと、実機のネオン感を担当 */
        * { box-sizing: border-box; touch-action: none; margin: 0; padding: 0; }
        body { 
            overflow: hidden; 
            background-color: #0b0b0b; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start; 
            height: 100vh; height: -webkit-fill-available;
        }
        
        #ui-panel {
            width: 100%; max-width: 450px; background: rgba(10, 10, 12, 0.95); padding: 12px 10px;
            border-bottom: 1px solid #00ffcc; color: #00ffcc; text-align: center; z-index: 10;
            box-shadow: 0 4px 20px rgba(0,255,204,0.15);
        }
        h1 { font-size: 14px; margin: 0 0 6px 0; text-transform: uppercase; letter-spacing: 2px; }
        
        .control-row { display: flex; gap: 6px; margin: 4px 0; justify-content: center; }
        .select-btn {
            flex: 1; padding: 8px; font-size: 11px; font-weight: bold;
            background: #1a1a1a; color: #888; border: 1px solid #444; border-radius: 6px; cursor: pointer;
            transition: all 0.2s ease;
        }
        .select-btn.active { color: #fff; box-shadow: 0 0 8px rgba(255,255,255,0.2); }
        .btn-push.active { background: #ff3366; border-color: #ff88aa; }
        .btn-hook.active { background: #00ffcc; color: #000; border-color: #88ffeb; }
        .btn-power.active { background: #ffaa00; color: #000; border-color: #ffcc55; }

        #status { font-size: 12px; font-weight: bold; color: #00ffcc; margin-top: 6px; }

        /* 3D/2D描画領域 */
        canvas {
            background: #121212;
            touch-action: none;
            flex-grow: 1;
            width: 100%; max-width: 450px;
        }

        #controls {
            position: absolute; bottom: 30px; width: 92%; max-width: 400px;
            display: flex; gap: 10px; justify-content: space-between; z-index: 10;
        }
        button.action-btn {
            flex: 1; padding: 16px 0; font-size: 15px; font-weight: 900; letter-spacing: 1px;
            border: none; border-radius: 10px; cursor: pointer; color: #fff;
            box-shadow: 0 4px 0 rgba(0,0,0,0.6);
        }
        button.action-btn:active { transform: translateY(4px); box-shadow: none; }
        #btn-reset { background: #222; color: #00ffcc; border: 2px solid #00ffcc; flex: 0.4; }
        #btn-ai-nav { background: #00ffcc; color: #000; border: 2px solid #88ffeb; }
        #btn-drop { background: #ff3366; border: 2px solid #ff88aa; }
    </style>
</head>
<body>

    <!-- UIシェル -->
    <div id="ui-panel">
        <h1>ClawSight</h1>
        <div class="control-row">
            <button id="btn-push" class="select-btn btn-push active">🔴 PUSH</button>
            <button id="btn-hook" class="select-btn btn-hook">🔵 HOOK</button>
        </div>
        <div class="control-row">
            <button id="btn-power-low" class="select-btn btn-power active">⚙️ パワー: 弱</button>
            <button id="btn-power-high" class="select-btn btn-power">🔥 パワー: 強</button>
        </div>
        <div id="status">Status: システム起動中...</div>
    </div>

    <!-- 描画キャンバス -->
    <canvas id="simCanvas"></canvas>

    <!-- アクションコントロール -->
    <div id="controls">
        <button id="btn-reset" class="action-btn">RESET</button>
        <button id="btn-ai-nav" class="action-btn">AI NAVI</button>
        <button id="btn-drop" class="action-btn">ACTION</button>
    </div>

    <!-- ESモジュールとしてAppCoreを読み込む（ここが全ての司令塔になる） -->
    <script type="module" src="./AppCore.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ClawSight v4.3 - Precision Select</title>
    <style>
        * { box-sizing: border-box; touch-action: none; }
        body { margin: 0; overflow: hidden; background-color: #0b0b0b; font-family: sans-serif; }
        
        #ui-panel {
            position: absolute; top: 10px; left: 10px; right: 10px; z-index: 100;
            background: rgba(0, 0, 0, 0.9); padding: 12px;
            border: 1px solid #00ffcc; border-radius: 12px; color: #00ffcc;
            text-align: center;
        }
        h1 { font-size: 14px; margin: 0 0 4px 0; text-transform: uppercase; letter-spacing: 1px; }
        
        /* アクション選択（PUSH / HOOK）スイッチ */
        #mode-selector {
            display: flex; gap: 6px; margin: 6px 0; justify-content: center;
        }
        .mode-btn {
            flex: 1; padding: 8px; font-size: 12px; font-weight: bold;
            background: #222; color: #aaa; border: 1px solid #444; border-radius: 6px; cursor: pointer;
        }
        .mode-btn.active-push { background: #ff3366; color: #fff; border-color: #ff88aa; }
        .mode-btn.active-hook { background: #00ffcc; color: #000; border-color: #88ffeb; }

        #status { font-size: 12px; font-weight: bold; color: #00ffcc; margin-top: 4px; }
        
        #controls {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            z-index: 100; width: 90%; max-width: 400px;
            display: flex; gap: 10px; justify-content: space-between;
        }
        button {
            flex: 1; padding: 15px 0; font-size: 15px; font-weight: 900;
            border: none; border-radius: 8px; cursor: pointer;
            box-shadow: 0 4px 0 rgba(0,0,0,0.6);
        }
        button:active { transform: translateY(4px); box-shadow: none; }
        #btn-drop { background: #ff3366; color: #fff; border: 2px solid #ff88aa; }
        #btn-ai-nav { background: #00ffcc; color: #000; border: 2px solid #88ffeb; }
        #btn-reset { background: #222; color: #00ffcc; border: 2px solid #00ffcc; flex: 0.5; }

        #target-ui {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.4); font-size: 11px; font-weight: bold; pointer-events: none; z-index: 50;
            text-align: center; text-shadow: 1px 1px 2px #000;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui-panel">
        <h1>ClawSight v4.3 [Precision Select]</h1>
        <div id="mode-selector">
            <button id="btn-push" class="mode-btn active-push" onclick="setInteractionMode('PUSH')">🔴 上を押す (PUSH)</button>
            <button id="btn-hook" class="mode-btn" onclick="setInteractionMode('HOOK')">🔵 下を突く (HOOK)</button>
        </div>
        <div id="status">Status: 狙うポイントを定めろ！</div>
    </div>

    <div id="target-ui">[ スワイプで照準を移動 ]</div>

    <div id="controls">
        <button id="btn-reset" onclick="resetSimulation()">RESET</button>
        <button id="btn-ai-nav" onclick="computeAINav()">AI NAVI</button>
        <button id="btn-drop" onclick="dropArm()">ACTION</button>
    </div>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0b0b0b);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 14, 16);
        camera.lookAt(0, -1, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        let boxGroup;
        let targetMesh, aiGhostMesh;
        let currentMode = 'PUSH'; // 'PUSH' (上を押す) または 'HOOK' (下を突く/引っ掛ける)
        
        let state = {
            x: 0, z: 0,       
            rotX: 0, rotZ: 0, 
            comX: 0, comZ: 0, 
            isAnimating: false,
            isFallen: false
        };

        function setInteractionMode(mode) {
            currentMode = mode;
            const pushBtn = document.getElementById('btn-push');
            const hookBtn = document.getElementById('btn-hook');
            if (mode === 'PUSH') {
                pushBtn.className = "mode-btn active-push";
                hookBtn.className = "mode-btn";
            } else {
                pushBtn.className = "mode-btn";
                hookBtn.className = "mode-btn active-hook";
            }
        }

        function buildStage() {
            const barMat = new THREE.MeshStandardMaterial({ color: 0x777777, roughness: 0.3 });
            const bar1 = new THREE.Mesh(new THREE.BoxGeometry(16, 0.5, 0.5), barMat);
            bar1.position.set(0, 0, -1.8);
            scene.add(bar1);
            const bar2 = new THREE.Mesh(new THREE.BoxGeometry(16, 0.5, 0.5), barMat);
            bar2.position.set(0, 0, 1.8);
            scene.add(bar2);
        }

        function initBox() {
            if (boxGroup) scene.remove(boxGroup);

            state.x = 0;
            state.z = 0;
            state.rotX = 0;
            state.rotZ = 0;
            state.isAnimating = false;
            state.isFallen = false;

            state.comX = (Math.random() - 0.5) * 0.8;
            state.comZ = (Math.random() - 0.5) * 0.8;

            document.getElementById('status').innerText = "Status: 狙うポイントを定めろ！";
            document.getElementById('status').style.color = "#00ffcc";

            boxGroup = new THREE.Group();
            
            // 【修正】長方形の箱を「縦置き（奥行き方向に長い状態：幅2.0, 高さ1.2, 奥行き4.0）」に変更
            const boxGeo = new THREE.BoxGeometry(2.0, 1.2, 4.0);
            const boxMat = new THREE.MeshStandardMaterial({ color: 0x00ffcc, roughness: 0.3, transparent: true, opacity: 1.0 });
            const mainMesh = new THREE.Mesh(boxGeo, boxMat);
            boxGroup.add(mainMesh);

            const edges = new THREE.EdgesGeometry(boxGeo);
            const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x000000 }));
            boxGroup.add(line);

            const comGeo = new THREE.SphereGeometry(0.25, 16, 16);
            const comMat = new THREE.MeshBasicMaterial({ color: 0xff0055 });
            const comMarker = new THREE.Mesh(comGeo, comMat);
            comMarker.name = "comMarker";
            comMarker.position.set(state.comX, 0, state.comZ);
            comMarker.visible = false;
            boxGroup.add(comMarker);

            boxGroup.position.set(state.x, 0.6, state.z);
            scene.add(boxGroup);

            if (aiGhostMesh) aiGhostMesh.visible = false;
        }

        function resetSimulation() {
            initBox();
        }

        // --- 【改善】輪っかではなく、ピシッと一点を指す「丸のポイント（ドット）」 ---
        const targetGeo = new THREE.CircleGeometry(0.25, 32);
        const targetMat = new THREE.MeshBasicMaterial({ color: 0xff3366, side: THREE.DoubleSide });
        targetMesh = new THREE.Mesh(targetGeo, targetMat);
        targetMesh.rotation.x = -Math.PI / 2;
        targetMesh.position.set(0, 0.02, 0);
        scene.add(targetMesh);

        // AIゴースト（同じく丸のポイント）
        const ghostGeo = new THREE.CircleGeometry(0.25, 32);
        const ghostMat = new THREE.MeshBasicMaterial({ color: 0x00ffcc, side: THREE.DoubleSide, transparent: true, opacity: 0.8 });
        aiGhostMesh = new THREE.Mesh(ghostGeo, ghostMat);
        aiGhostMesh.rotation.x = -Math.PI / 2;
        aiGhostMesh.visible = false;
        scene.add(aiGhostMesh);

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);

        function updateTarget(event) {
            if(event.target.tagName === 'BUTTON') return;
            let clientX = event.touches ? event.touches[0].clientX : event.clientX;
            let clientY = event.touches ? event.touches[0].clientY : event.clientY;
            
            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            const targetPos = new THREE.Vector3();
            raycaster.ray.intersectPlane(plane, targetPos);
            
            if (targetPos) {
                targetMesh.position.x = Math.max(-5, Math.min(5, targetPos.x));
                targetMesh.position.z = Math.max(-5, Math.min(5, targetPos.z));
            }
        }
        window.addEventListener('touchmove', updateTarget, {passive: false});
        window.addEventListener('mousemove', updateTarget);

        function computeAINav() {
            if (state.isFallen) return;

            // 縦置きの橋渡しにおける最適な狙い目（重心の逆側の角を突く）
            const bestX = state.x + (state.comX > 0 ? -0.8 : 0.8);
            const bestZ = state.z - 1.5; // 奥の角を狙う

            aiGhostMesh.position.set(bestX, 0.03, bestZ);
            aiGhostMesh.visible = true;

            document.getElementById('status').innerText = "🤖 AI NAVI: 緑の丸ポイント（推奨位置）を狙え！";
            document.getElementById('status').style.color = "#00ffcc";
        }

        function dropArm() {
            if (state.isAnimating || state.isFallen) return;

            const tx = targetMesh.position.x;
            const tz = targetMesh.position.z;

            state.isAnimating = true;
            document.getElementById('status').innerText = currentMode === 'PUSH' ? "Status: 上から押し込み中..." : "Status: 下を突いて引っ掛け中...";

            // 選択されたモード（PUSH vs HOOK）による挙動の分岐
            let leverageX = tx - (state.x + state.comX);
            let leverageZ = tz - (state.z + state.comZ);

            let targetX = state.x + leverageX * (currentMode === 'PUSH' ? 0.35 : 0.5);
            let targetZ = state.z + leverageZ * (currentMode === 'PUSH' ? 0.4 : 0.6);
            let targetRotX = leverageZ * (currentMode === 'PUSH' ? 0.4 : 0.7);
            let targetRotZ = -leverageX * (currentMode === 'PUSH' ? 0.4 : 0.7);

            let progress = 0;
            const animateStep = () => {
                progress += 0.07;
                if (progress < 1.0) {
                    state.x += (targetX - state.x) * 0.25;
                    state.z += (targetZ - state.z) * 0.25;
                    state.rotX += (targetRotX - state.rotX) * 0.25;
                    state.rotZ += (targetRotZ - state.rotZ) * 0.25;

                    boxGroup.position.set(state.x, 0.6, state.z);
                    boxGroup.rotation.set(state.rotX, 0, state.rotZ);
                    requestAnimationFrame(animateStep);
                } else {
                    // 縦置きの場合、バーの間隔（Z軸方向: -1.8 ～ 1.8）に対して、
                    // 箱の端がバーの内側に落ち込むか、大きく傾いたら落下
                    const distZMax = Math.abs(state.z) + 2.0; // 奥行き半分のサイズ考慮
                    const distZMin = Math.abs(state.z) - 2.0;
                    const isDropped = (distZMin < -1.8 || distZMax > 1.8 || Math.abs(state.rotX) > 0.35);

                    if (isDropped) {
                        triggerFall();
                    } else {
                        state.isAnimating = false;
                        document.getElementById('status').innerText = "Status: アクション完了！ 次の手へ";
                    }
                }
            };
            animateStep();
        }

        function triggerFall() {
            state.isFallen = true;
            document.getElementById('status').innerText = "🎉 攻略成功！ 景品落下！";
            document.getElementById('status').style.color = "#ff3366";

            let fallProgress = 0;
            const fallAnim = () => {
                fallProgress += 0.05;
                state.y = 0.6 - fallProgress * 2.5;
                boxGroup.position.y = state.y;
                boxGroup.rotation.x += 0.08;

                if (fallProgress < 1.0) {
                    requestAnimationFrame(fallAnim);
                } else {
                    boxGroup.children[0].material.opacity = 0.4;
                    const com = boxGroup.getObjectByName("comMarker");
                    if (com) com.visible = true; 
                }
            };
            fallAnim();
        }

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        buildStage();
        initBox();
        animate();
    </script>
</body>
</html>

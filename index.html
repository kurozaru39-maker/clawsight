<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ClawSight v4.6 - Ultimate Arcade</title>
    <style>
        * { box-sizing: border-box; touch-action: none; }
        body { margin: 0; overflow: hidden; background-color: #0b0b0b; font-family: sans-serif; }
        
        #ui-panel {
            position: absolute; top: 10px; left: 10px; right: 10px; z-index: 100;
            background: rgba(0, 0, 0, 0.94); padding: 12px;
            border: 1px solid #00ffcc; border-radius: 12px; color: #00ffcc;
            text-align: center; box-shadow: 0 4px 20px rgba(0,255,204,0.2);
        }
        h1 { font-size: 14px; margin: 0 0 4px 0; text-transform: uppercase; letter-spacing: 1px; }
        
        .control-row {
            display: flex; gap: 6px; margin: 4px 0; justify-content: center;
        }
        .select-btn {
            flex: 1; padding: 6px; font-size: 10px; font-weight: bold;
            background: #1a1a1a; color: #888; border: 1px solid #444; border-radius: 6px; cursor: pointer;
        }
        .select-btn.active-push { background: #ff3366; color: #fff; border-color: #ff88aa; }
        .select-btn.active-hook { background: #00ffcc; color: #000; border-color: #88ffeb; }
        .select-btn.active-gap { background: #ffaa00; color: #000; border-color: #ffcc55; }

        #status { font-size: 12px; font-weight: bold; color: #00ffcc; margin-top: 4px; }
        
        #controls {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            z-index: 100; width: 90%; max-width: 400px;
            display: flex; gap: 10px; justify-content: space-between;
        }
        button {
            flex: 1; padding: 15px 0; font-size: 15px; font-weight: 900;
            border: none; border-radius: 8px; cursor: pointer;
            box-shadow: 0 4px 0 rgba(0,0,0,0.6);
        }
        button:active { transform: translateY(4px); box-shadow: none; }
        #btn-drop { background: #ff3366; color: #fff; border: 2px solid #ff88aa; }
        #btn-ai-nav { background: #00ffcc; color: #000; border: 2px solid #88ffeb; }
        #btn-reset { background: #222; color: #00ffcc; border: 2px solid #00ffcc; flex: 0.5; }

        #target-ui {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.4); font-size: 11px; font-weight: bold; pointer-events: none; z-index: 50;
            text-align: center; text-shadow: 1px 1px 2px #000;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui-panel">
        <h1>ClawSight v4.6 [Ultimate Arcade]</h1>
        <div class="control-row">
            <button id="btn-push" class="select-btn active-push" onclick="setInteractionMode('PUSH')">🔴 上面PUSH</button>
            <button id="btn-hook" class="select-btn" onclick="setInteractionMode('HOOK')">🔵 下側HOOK</button>
        </div>
        <div class="control-row">
            <button id="gap-wide" class="select-btn" onclick="setGapMode('WIDE')">📐 幅: ゆるい</button>
            <button id="gap-normal" class="select-btn active-gap" onclick="setGapMode('NORMAL')">📐 幅: 標準</button>
            <button id="gap-tight" class="select-btn" onclick="setGapMode('TIGHT')">📐 幅: シビア(激狭)</button>
        </div>
        <div id="status">Status: 2点アームの照準を定めろ！</div>
    </div>

    <div id="target-ui">[ スワイプでデュアルアームを移動 ]</div>

    <div id="controls">
        <button id="btn-reset" onclick="resetSimulation()">RESET</button>
        <button id="btn-ai-nav" onclick="computeAINav()">AI NAVI</button>
        <button id="btn-drop" onclick="dropArm()">ACTION</button>
    </div>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0b0b0b);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 14, 16);
        camera.lookAt(0, -1, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        let boxGroup;
        let leftClawMesh, rightClawMesh, aiGhostGroup;
        let bar1, bar2;
        let currentMode = 'PUSH'; 
        let gapMode = 'NORMAL';   // 'WIDE', 'NORMAL', 'TIGHT'
        
        let state = {
            x: 0, z: 0,       
            rotX: 0, rotZ: 0, 
            comX: 0, comZ: 0, 
            isAnimating: false,
            isFallen: false
        };

        const CLAW_SPAN = 1.2; 

        function setInteractionMode(mode) {
            currentMode = mode;
            document.getElementById('btn-push').className = mode === 'PUSH' ? "select-btn active-push" : "select-btn";
            document.getElementById('btn-hook').className = mode === 'HOOK' ? "select-btn active-hook" : "select-btn";
        }

        function setGapMode(gMode) {
            gapMode = gMode;
            document.getElementById('gap-wide').className = gMode === 'WIDE' ? "select-btn active-gap" : "select-btn";
            document.getElementById('gap-normal').className = gMode === 'NORMAL' ? "select-btn active-gap" : "select-btn";
            document.getElementById('gap-tight').className = gMode === 'TIGHT' ? "select-btn active-gap" : "select-btn";
            updateBarPositions();
        }

        function buildStage() {
            const barMat = new THREE.MeshStandardMaterial({ color: 0x777777, roughness: 0.3 });
            bar1 = new THREE.Mesh(new THREE.BoxGeometry(16, 0.5, 0.5), barMat);
            bar2 = new THREE.Mesh(new THREE.BoxGeometry(16, 0.5, 0.5), barMat);
            scene.add(bar1);
            scene.add(bar2);
            updateBarPositions();
        }

        function updateBarPositions() {
            let zDist = 1.8;
            if (gapMode === 'WIDE') zDist = 2.2;
            if (gapMode === 'TIGHT') zDist = 1.45; // 箱のサイズに対してシビアな幅

            bar1.position.set(0, 0, -zDist);
            bar2.position.set(0, 0, zDist);
        }

        function getBarZ() {
            if (gapMode === 'WIDE') return 2.2;
            if (gapMode === 'TIGHT') return 1.45;
            return 1.8;
        }

        function initBox() {
            if (boxGroup) scene.remove(boxGroup);

            state.x = 0;
            state.z = 0;
            state.rotX = 0;
            state.rotZ = 0;
            state.isAnimating = false;
            state.isFallen = false;

            state.comX = (Math.random() - 0.5) * 0.6;
            state.comZ = (Math.random() - 0.5) * 0.6;

            document.getElementById('status').innerText = "Status: 橋渡しの隙間を攻略せよ！";
            document.getElementById('status').style.color = "#00ffcc";

            boxGroup = new THREE.Group();
            
            // リアルなプライズ箱サイズ（幅2.2, 高さ1.2, 奥行き3.8）
            const boxGeo = new THREE.BoxGeometry(2.2, 1.2, 3.8);
            const boxMat = new THREE.MeshStandardMaterial({ color: 0x00ffcc, roughness: 0.3, transparent: true, opacity: 1.0 });
            const mainMesh = new THREE.Mesh(boxGeo, boxMat);
            boxGroup.add(mainMesh);

            const edges = new THREE.EdgesGeometry(boxGeo);
            const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x000000 }));
            boxGroup.add(line);

            const comGeo = new THREE.SphereGeometry(0.25, 16, 16);
            const comMat = new THREE.MeshBasicMaterial({ color: 0xff0055 });
            const comMarker = new THREE.Mesh(comGeo, comMat);
            comMarker.name = "comMarker";
            comMarker.position.set(state.comX, 0, state.comZ);
            comMarker.visible = false;
            boxGroup.add(comMarker);

            boxGroup.position.set(state.x, 0.6, state.z);
            scene.add(boxGroup);

            if (aiGhostGroup) aiGhostGroup.visible = false;
        }

        function resetSimulation() {
            initBox();
        }

        // --- 【修正】depthTest: false により、箱に重なっても絶対にポイントが消えない最前面描画 ---
        const clawGeo = new THREE.CircleGeometry(0.22, 32);
        
        const leftMat = new THREE.MeshBasicMaterial({ color: 0xff3366, side: THREE.DoubleSide, depthTest: false });
        leftClawMesh = new THREE.Mesh(clawGeo, leftMat);
        leftClawMesh.rotation.x = -Math.PI / 2;
        leftClawMesh.position.set(-CLAW_SPAN/2, 0.7, 0);
        leftClawMesh.renderOrder = 999;
        scene.add(leftClawMesh);

        const rightMat = new THREE.MeshBasicMaterial({ color: 0xff3366, side: THREE.DoubleSide, depthTest: false });
        rightClawMesh = new THREE.Mesh(clawGeo, rightMat);
        rightClawMesh.rotation.x = -Math.PI / 2;
        rightClawMesh.position.set(CLAW_SPAN/2, 0.7, 0);
        rightClawMesh.renderOrder = 999;
        scene.add(rightClawMesh);

        // AIゴースト（同じく最前面描画）
        aiGhostGroup = new THREE.Group();
        const ghostMat = new THREE.MeshBasicMaterial({ color: 0x00ffcc, side: THREE.DoubleSide, transparent: true, opacity: 0.9, depthTest: false });
        const gLeft = new THREE.Mesh(clawGeo, ghostMat); gLeft.rotation.x = -Math.PI/2; gLeft.position.set(-CLAW_SPAN/2, 0, 0); gLeft.renderOrder = 999;
        const gRight = new THREE.Mesh(clawGeo, ghostMat); gRight.rotation.x = -Math.PI/2; gRight.position.set(CLAW_SPAN/2, 0, 0); gRight.renderOrder = 999;
        aiGhostGroup.add(gLeft); aiGhostGroup.add(gRight);
        aiGhostGroup.position.y = 0.7;
        aiGhostGroup.visible = false;
        scene.add(aiGhostGroup);

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);

        function updateTarget(event) {
            if(event.target.tagName === 'BUTTON') return;
            let clientX = event.touches ? event.touches[0].clientX : event.clientX;
            let clientY = event.touches ? event.touches[0].clientY : event.clientY;
            
            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            const targetPos = new THREE.Vector3();
            raycaster.ray.intersectPlane(plane, targetPos);
            
            if (targetPos) {
                const cx = Math.max(-4.5, Math.min(4.5, targetPos.x));
                const cz = Math.max(-4.5, Math.min(4.5, targetPos.z));

                leftClawMesh.position.set(cx - CLAW_SPAN/2, 0.7, cz);
                rightClawMesh.position.set(cx + CLAW_SPAN/2, 0.7, cz);
            }
        }
        window.addEventListener('touchmove', updateTarget, {passive: false});
        window.addEventListener('mousemove', updateTarget);

        function computeAINav() {
            if (state.isFallen) return;

            const bestX = state.x;
            const bestZ = state.z - 1.6;

            aiGhostGroup.position.x = bestX;
            aiGhostGroup.position.z = bestZ;
            aiGhostGroup.visible = true;

            document.getElementById('status').innerText = "🤖 AI NAVI: 緑の2点ポイントを狙え！";
            document.getElementById('status').style.color = "#00ffcc";
        }

        function dropArm() {
            if (state.isAnimating || state.isFallen) return;

            const tx = (leftClawMesh.position.x + rightClawMesh.position.x) / 2;
            const tz = leftClawMesh.position.z;

            state.isAnimating = true;
            document.getElementById('status').innerText = currentMode === 'PUSH' ? "Status: 上面をプッシュ中..." : "Status: 下フチをフック中...";

            const leverageX = tx - (state.x + state.comX);
            const leverageZ = tz - (state.z + state.comZ);

            let targetX = state.x + leverageX * (currentMode === 'PUSH' ? 0.22 : 0.35);
            let targetZ = state.z + leverageZ * (currentMode === 'PUSH' ? 0.28 : 0.45);
            let targetRotX = leverageZ * (currentMode === 'PUSH' ? 0.25 : 0.5);
            let targetRotZ = -leverageX * (currentMode === 'PUSH' ? 0.25 : 0.5);

            let progress = 0;
            const animateStep = () => {
                progress += 0.07;
                if (progress < 1.0) {
                    state.x += (targetX - state.x) * 0.25;
                    state.z += (targetZ - state.z) * 0.25;
                    state.rotX += (targetRotX - state.rotX) * 0.25;
                    state.rotZ += (targetRotZ - state.rotZ) * 0.25;

                    boxGroup.position.set(state.x, 0.6, state.z);
                    boxGroup.rotation.set(state.rotX, 0, state.rotZ);
                    requestAnimationFrame(animateStep);
                } else {
                    const currentBarZ = getBarZ();
                    const boxHalfDepth = 1.9; 
                    const frontEdge = state.z + boxHalfDepth;
                    const backEdge = state.z - boxHalfDepth;

                    // 縦置きの箱がバー幅（currentBarZ）のどちらかの外側に落ちたか判定
                    const isDropped = (backEdge < -currentBarZ || frontEdge > currentBarZ || Math.abs(state.rotX) > 0.32);

                    if (isDropped) {
                        triggerFall();
                    } else {
                        state.isAnimating = false;
                        document.getElementById('status').innerText = "Status: 粘られて耐えられた！ 次の手を！";
                    }
                }
            };
            animateStep();
        }

        function triggerFall() {
            state.isFallen = true;
            document.getElementById('status').innerText = "🎉 攻略成功！ 景品落下！";
            document.getElementById('status').style.color = "#ff3366";

            let fallProgress = 0;
            const fallAnim = () => {
                fallProgress += 0.05;
                state.y = 0.6 - fallProgress * 2.5;
                boxGroup.position.y = state.y;
                boxGroup.rotation.x += 0.08;

                if (fallProgress < 1.0) {
                    requestAnimationFrame(fallAnim);
                } else {
                    boxGroup.children[0].material.opacity = 0.4;
                    const com = boxGroup.getObjectByName("comMarker");
                    if (com) com.visible = true; 
                }
            };
            fallAnim();
        }

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        buildStage();
        initBox();
        animate();
    </script>
</body>
</html>

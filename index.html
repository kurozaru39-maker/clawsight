<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ClawSight 3D - v2.0</title>
    <style>
        * { box-sizing: border-box; touch-action: none; }
        body { margin: 0; overflow: hidden; background-color: #0d0d0d; font-family: sans-serif; }
        
        #ui-panel {
            position: absolute; top: 10px; left: 10px; right: 10px; z-index: 100;
            background: rgba(0, 0, 0, 0.85); padding: 12px;
            border: 1px solid #00ffcc; border-radius: 12px; color: #00ffcc;
            pointer-events: auto; /* UI部分はタッチ可能にする */
        }
        h1 { font-size: 15px; margin: 0 0 6px 0; text-transform: uppercase; text-align: center; }
        
        .mode-select { margin-bottom: 8px; width: 100%; }
        select { 
            width: 100%; padding: 8px; background: #222; color: #00ffcc; 
            border: 1px solid #00ffcc; border-radius: 4px; font-size: 12px; font-weight: bold;
        }

        #status { font-size: 13px; font-weight: bold; color: #00ffcc; margin-top: 4px; text-align: center; }
        
        #controls {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            z-index: 100; width: 90%; max-width: 400px;
            display: flex; gap: 10px; justify-content: space-between; pointer-events: auto;
        }
        button {
            flex: 1; padding: 16px 0; font-size: 16px; font-weight: 900;
            border: none; border-radius: 8px; cursor: pointer;
            box-shadow: 0 4px 0 rgba(0,0,0,0.5); transition: transform 0.1s;
        }
        button:active { transform: translateY(4px); box-shadow: none; }
        #btn-drop { background: #ff3366; color: #fff; border: 2px solid #ff88aa; }
        #btn-reset { background: #333; color: #00ffcc; border: 2px solid #00ffcc; flex: 0.5; }

        #target-ui {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.4); font-size: 12px; font-weight: bold; pointer-events: none; z-index: 50;
            text-align: center; text-shadow: 1px 1px 2px #000;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
</head>
<body>

    <div id="ui-panel">
        <h1>VIRTUAL PLAY MODE v2.0</h1>
        <div class="mode-select">
            <select id="bridgeMode" onchange="initStage()">
                <option value="parallel_h">設定1：平行・横向き（画面左右）</option>
                <option value="parallel_v">設定2：直線・縦向き（画面上下）</option>
                <option value="suehirogari">設定3：末広がり（右側が広い）</option>
            </select>
        </div>
        <div id="status">Status: プレイ中... 重心を探れ！</div>
    </div>

    <div id="target-ui">[ スワイプで移動 ]</div>

    <div id="controls">
        <button id="btn-reset" onclick="initStage()">RESET</button>
        <button id="btn-drop" onclick="dropArm()">DROP ARM</button>
    </div>

    <script>
        // --- 1. Three.js & Cannon.js 初期化 ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 16, 10);
        camera.lookAt(0, -2, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 15, 5);
        scene.add(dirLight);

        const world = new CANNON.World();
        world.gravity.set(0, -9.82, 0);
        world.broadphase = new CANNON.NaiveBroadphase();
        world.solver.iterations = 40;

        const barMat = new CANNON.Material("bar");
        const boxMat = new CANNON.Material("box");
        const contactMat = new CANNON.ContactMaterial(barMat, boxMat, { friction: 0.6, restitution: 0.05 });
        world.addContactMaterial(contactMat);

        // --- 2. ステージ構築（動的生成） ---
        let bars = [];
        let barMeshes = [];

        function clearBars() {
            bars.forEach(b => world.removeBody(b));
            barMeshes.forEach(m => scene.remove(m));
            bars = []; barMeshes = [];
        }

        function createBar(x, z, rotY = 0) {
            const shape = new CANNON.Box(new CANNON.Vec3(10, 1.0, 0.25)); 
            const body = new CANNON.Body({ mass: 0, material: barMat });
            body.position.set(x, -0.8, z);
            body.quaternion.setFromAxisAngle(new CANNON.Vec3(0, 1, 0), rotY);
            world.addBody(body);
            bars.push(body);

            const geo = new THREE.BoxGeometry(20, 0.4, 0.5);
            const mat = new THREE.MeshLambertMaterial({ color: 0x666666 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.copy(body.position);
            mesh.quaternion.copy(body.quaternion);
            scene.add(mesh);
            barMeshes.push(mesh);
        }

        // --- 3. 箱（ターゲット） ---
        let boxBody, boxMesh, comMarker;
        let isFallen = false;

        function initBox(mode) {
            if (boxBody) { world.removeBody(boxBody); scene.remove(boxMesh); }
            isFallen = false;
            document.getElementById('status').innerText = "Status: プレイ中... 重心を探れ！";
            document.getElementById('status').style.color = "#00ffcc";

            boxBody = new CANNON.Body({ mass: 1, material: boxMat });
            const shape = new CANNON.Box(new CANNON.Vec3(1.6, 0.75, 0.75));
            
            // 重心をランダム化
            const comX = (Math.random() - 0.5) * 1.5;
            const comZ = (Math.random() - 0.5) * 1.5;
            boxBody.addShape(shape, new CANNON.Vec3(comX, -0.2, comZ)); 
            boxBody.position.set(0, 4, 0);

            // モードに応じた初期角度
            if (mode === 'parallel_h' || mode === 'suehirogari') {
                boxBody.quaternion.setFromAxisAngle(new CANNON.Vec3(0,1,0), Math.PI/2); // 縦置き
            } else {
                boxBody.quaternion.setFromAxisAngle(new CANNON.Vec3(0,1,0), 0); // 横置き
            }
            
            // 少しだけランダムな傾きを足す
            const currentQuat = boxBody.quaternion.clone();
            const randomQuat = new CANNON.Quaternion();
            randomQuat.setFromAxisAngle(new CANNON.Vec3(0,1,0), (Math.random() - 0.5) * 0.2);
            boxBody.quaternion.copy(currentQuat.mult(randomQuat));
            
            world.addBody(boxBody);

            // 描画メッシュの生成
            const geo = new THREE.BoxGeometry(3.2, 1.5, 1.5);
            const mat = new THREE.MeshLambertMaterial({ color: 0x00ffcc, transparent: true, opacity: 1.0 });
            boxMesh = new THREE.Mesh(geo, mat);
            
            const edges = new THREE.EdgesGeometry(geo);
            const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x000000 }));
            boxMesh.add(line);

            // 【ハックポイント】答え合わせ用の重心マーカーを子要素として追加
            const comGeo = new THREE.SphereGeometry(0.3, 16, 16);
            const comMat = new THREE.MeshBasicMaterial({ color: 0xff0055 });
            comMarker = new THREE.Mesh(comGeo, comMat);
            comMarker.position.set(comX, -0.2, comZ);
            comMarker.visible = false; // 初期は隠す
            boxMesh.add(comMarker);
            
            scene.add(boxMesh);
        }

        window.initStage = function() {
            clearBars();
            const mode = document.getElementById('bridgeMode').value;
            const gap = 1.6;

            if (mode === 'parallel_h') {
                createBar(0, -gap);
                createBar(0, gap);
            } else if (mode === 'parallel_v') {
                createBar(-gap, 0, Math.PI/2);
                createBar(gap, 0, Math.PI/2);
            } else if (mode === 'suehirogari') {
                // 右側(+X)に向かって広がるハの字
                createBar(0, -gap, -0.1);
                createBar(0, gap, 0.1);
            }
            initBox(mode);
        };

        // --- 4. ターゲットマーカー＆タッチ操作 ---
        const targetGeo = new THREE.RingGeometry(0.5, 0.7, 16);
        const targetMat = new THREE.MeshBasicMaterial({ color: 0xff3366, side: THREE.DoubleSide });
        const targetMesh = new THREE.Mesh(targetGeo, targetMat);
        targetMesh.rotation.x = -Math.PI / 2;
        targetMesh.position.set(0, 1.5, 0);
        scene.add(targetMesh);

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -1.5);

        function updateTarget(event) {
            // パネル上のタッチは無視する
            if(event.target.tagName === 'BUTTON' || event.target.tagName === 'SELECT') return;

            let clientX = event.touches ? event.touches[0].clientX : event.clientX;
            let clientY = event.touches ? event.touches[0].clientY : event.clientY;
            
            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            const targetPos = new THREE.Vector3();
            raycaster.ray.intersectPlane(plane, targetPos);
            
            if (targetPos) {
                targetPos.x = Math.max(-5, Math.min(5, targetPos.x));
                targetPos.z = Math.max(-5, Math.min(5, targetPos.z));
                targetMesh.position.set(targetPos.x, 1.5, targetPos.z);
            }
        }
        window.addEventListener('touchmove', updateTarget, {passive: false});
        window.addEventListener('mousemove', updateTarget);

        // --- 5. アーム投下 ---
        window.dropArm = function() {
            if (!boxBody || isFallen) return;
            
            const tx = targetMesh.position.x;
            const tz = targetMesh.position.z;
            const dx = tx - boxBody.position.x;
            const dz = tz - boxBody.position.z;
            const distance = Math.sqrt(dx*dx + dz*dz);
            
            if (distance > 2.5) return; // 空振り

            const forcePoint = new CANNON.Vec3(tx, boxBody.position.y, tz);
            const upwardForce = 14; 
            const pushForce = distance < 1.0 ? -6 : 0; 

            boxBody.applyImpulse(new CANNON.Vec3(0, upwardForce + pushForce, 0), forcePoint);
        };

        // --- 6. アニメーション＆落下判定 ---
        function animate() {
            requestAnimationFrame(animate);
            world.step(1 / 60);
            
            if (boxBody && boxMesh) {
                boxMesh.position.copy(boxBody.position);
                boxMesh.quaternion.copy(boxBody.quaternion);

                // 【ハックポイント】落下判定と答え合わせ
                if (!isFallen && boxBody.position.y < -3.0) {
                    isFallen = true;
                    // 箱を半透明にして重心を可視化
                    boxMesh.material.opacity = 0.4;
                    comMarker.visible = true;
                    
                    const statusEl = document.getElementById('status');
                    statusEl.innerText = "🎉 落下成功！重心はここだった！";
                    statusEl.style.color = "#ff3366";
                }
            }
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        initStage();
        animate();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ClawSight 3D - Solid v3.0</title>
    <style>
        * { box-sizing: border-box; touch-action: none; }
        body { margin: 0; overflow: hidden; background-color: #0b0b0b; font-family: sans-serif; }
        
        #ui-panel {
            position: absolute; top: 10px; left: 10px; right: 10px; z-index: 100;
            background: rgba(0, 0, 0, 0.9); padding: 12px;
            border: 1px solid #00ffcc; border-radius: 12px; color: #00ffcc;
        }
        h1 { font-size: 14px; margin: 0 0 6px 0; text-transform: uppercase; text-align: center; letter-spacing: 1px; }
        
        .mode-select { margin-bottom: 8px; width: 100%; }
        select { 
            width: 100%; padding: 8px; background: #1a1a1a; color: #00ffcc; 
            border: 1px solid #00ffcc; border-radius: 6px; font-size: 12px; font-weight: bold;
        }
        #status { font-size: 12px; font-weight: bold; color: #00ffcc; margin-top: 4px; text-align: center; }
        
        #controls {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            z-index: 100; width: 90%; max-width: 400px;
            display: flex; gap: 10px; justify-content: space-between;
        }
        button {
            flex: 1; padding: 16px 0; font-size: 15px; font-weight: 900;
            border: none; border-radius: 8px; cursor: pointer;
            box-shadow: 0 4px 0 rgba(0,0,0,0.6);
        }
        button:active { transform: translateY(4px); box-shadow: none; }
        #btn-drop { background: #ff3366; color: #fff; border: 2px solid #ff88aa; }
        #btn-reset { background: #222; color: #00ffcc; border: 2px solid #00ffcc; flex: 0.5; }

        #target-ui {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.4); font-size: 12px; font-weight: bold; pointer-events: none; z-index: 50;
            text-align: center; text-shadow: 1px 1px 2px #000;
        }
    </style>
    <!-- 描画の確実性を担保するThree.jsのみ読み込み -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui-panel">
        <h1>ClawSight 3D [Solid Core]</h1>
        <div class="mode-select">
            <select id="bridgeMode" onchange="resetSimulation()">
                <option value="parallel_h">設定1：平行・横向き（左右のバー）</option>
                <option value="parallel_v">設定2：直線・縦向き（上下のバー）</option>
                <option value="suehirogari">設定3：末広がり（右側が広い）</option>
            </select>
        </div>
        <div id="status">Status: 物理演算稼働中 (Solid Core)</div>
    </div>

    <div id="target-ui">[ スワイプで狙いを定める ]</div>

    <div id="controls">
        <button id="btn-reset" onclick="resetSimulation()">RESET</button>
        <button id="btn-drop" onclick="dropArm()">DROP ARM</button>
    </div>

    <script>
        // --- 1. シーン・カメラ・レンダラーの堅牢な初期化 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0b0b0b);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 14, 16);
        camera.lookAt(0, -1, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // iPhoneのRetina対応かつパフォーマンス保護
        document.body.appendChild(renderer.domElement);

        // ライティング
        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // --- 2. 物理オブジェクトとゲーム状態の定義 ---
        let boxGroup; // 箱のメッシュ＋重心をまとめるグループ
        let bars = [];
        let targetMesh;
        
        let physicsState = {
            x: 0, y: 4, z: 0,
            vx: 0, vy: 0, vz: 0,
            rotX: 0, rotY: 0, rotZ: 0,
            vRotX: 0, vRotY: 0, vRotZ: 0,
            comX: 0, comZ: 0, // 重心のズレ
            isFallen: false
        };

        // --- 3. ステージ構築 ---
        function buildStage() {
            // 既存のバーをクリア
            bars.forEach(b => scene.remove(b));
            bars = [];

            const mode = document.getElementById('bridgeMode').value;
            const barMat = new THREE.MeshStandardMaterial({ color: 0x777777, roughness: 0.3 });

            if (mode === 'parallel_h') {
                createBar(0, -2.0, 0, 16, 0.5, 0.5, 0);
                createBar(0, 2.0, 0, 16, 0.5, 0.5, 0);
            } else if (mode === 'parallel_v') {
                createBar(-2.0, 0, 0, 0.5, 0.5, 16, Math.PI/2);
                createBar(2.0, 0, 0, 0.5, 0.5, 16, Math.PI/2);
            } else if (mode === 'suehirogari') {
                // ハの字（右側が広がる）
                createBar(0, -2.0, 0, 16, 0.5, 0.5, -0.08);
                createBar(0, 2.0, 0, 16, 0.5, 0.5, 0.08);
            }
        }

        function createBar(x, y, z, w, h, d, rotY) {
            const geo = new THREE.BoxGeometry(w, h, d);
            const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: 0x666666 }));
            mesh.position.set(x, y, z);
            mesh.rotation.y = rotY;
            scene.add(mesh);
            bars.push(mesh);
        }

        // --- 4. 箱（ターゲット）の生成 ---
        function initBox() {
            if (boxGroup) scene.remove(boxGroup);

            physicsState.x = 0;
            physicsState.y = 4.5; // 上空からスタート
            physicsState.z = 0;
            physicsState.vx = 0; physicsState.vy = 0; physicsState.vz = 0;
            physicsState.rotX = (Math.random() - 0.5) * 0.2;
            physicsState.rotY = Math.random() * Math.PI;
            physicsState.rotZ = (Math.random() - 0.5) * 0.2;
            physicsState.vRotX = 0; physicsState.vRotY = 0; physicsState.vRotZ = 0;
            physicsState.isFallen = false;

            // 重心のランダムオフセット
            physicsState.comX = (Math.random() - 0.5) * 1.0;
            physicsState.comZ = (Math.random() - 0.5) * 1.0;

            document.getElementById('status').innerText = "Status: プレイ中... 重心を探れ！";
            document.getElementById('status').style.color = "#00ffcc";

            // 箱の構築
            boxGroup = new THREE.Group();
            
            const boxGeo = new THREE.BoxGeometry(3.0, 1.4, 3.0);
            const boxMat = new THREE.MeshStandardMaterial({ color: 0x00ffcc, roughness: 0.3, transparent: true, opacity: 1.0 });
            const mainMesh = new THREE.Mesh(boxGeo, boxMat);
            boxGroup.add(mainMesh);

            // ワイヤーフレームで視認性向上
            const edges = new THREE.EdgesGeometry(boxGeo);
            const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x000000 }));
            boxGroup.add(line);

            // 答え合わせ用の重心マーカー（初期は非表示）
            const comGeo = new THREE.SphereGeometry(0.3, 16, 16);
            const comMat = new THREE.MeshBasicMaterial({ color: 0xff0055 });
            const comMarker = new THREE.Mesh(comGeo, comMat);
            comMarker.name = "comMarker";
            comMarker.position.set(physicsState.comX, 0, physicsState.comZ);
            comMarker.visible = false;
            boxGroup.add(comMarker);

            scene.add(boxGroup);
        }

        function resetSimulation() {
            buildStage();
            initBox();
        }

        // --- 5. エイムターゲットとタッチ操作 ---
        const targetGeo = new THREE.RingGeometry(0.4, 0.6, 16);
        const targetMat = new THREE.MeshBasicMaterial({ color: 0xff3366, side: THREE.DoubleSide });
        targetMesh = new THREE.Mesh(targetGeo, targetMat);
        targetMesh.rotation.x = -Math.PI / 2;
        targetMesh.position.set(0, 0, 0);
        scene.add(targetMesh);

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);

        function updateTarget(event) {
            if(event.target.tagName === 'BUTTON' || event.target.tagName === 'SELECT') return;
            let clientX = event.touches ? event.touches[0].clientX : event.clientX;
            let clientY = event.touches ? event.touches[0].clientY : event.clientY;
            
            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            const targetPos = new THREE.Vector3();
            raycaster.ray.intersectPlane(plane, targetPos);
            
            if (targetPos) {
                targetMesh.position.x = Math.max(-4, Math.min(4, targetPos.x));
                targetMesh.position.z = Math.max(-4, Math.min(4, targetPos.z));
            }
        }
        window.addEventListener('touchmove', updateTarget, {passive: false});
        window.addEventListener('mousemove', updateTarget);

        // --- 6. アーム投下（カスタム物理インパルス） ---
        function dropArm() {
            if (physicsState.isFallen) return;

            const tx = targetMesh.position.x;
            const tz = targetMesh.position.z;

            // 距離判定
            const dx = tx - physicsState.x;
            const dz = tz - physicsState.z;
            const dist = Math.sqrt(dx*dx + dz*dz);

            if (dist > 2.8) return; // 遠すぎたら空振り

            // 重心のズレと叩いた位置の差から「回転トルク」を発生させる
            const leverageX = tx - (physicsState.x + physicsState.comX);
            const leverageZ = tz - (physicsState.z + physicsState.comZ);

            physicsState.vy += 0.3; // 持ち上がり
            physicsState.vRotX += leverageZ * 0.12; // 傾き
            physicsState.vRotZ -= leverageX * 0.12; 
            physicsState.vx += leverageX * 0.05;
            physicsState.vz += leverageZ * 0.05;
        }

        // --- 7. カスタム物理演算メインループ（すり抜け完全防止ロジック） ---
        function updatePhysics() {
            if (!boxGroup) return;

            if (!physicsState.isFallen) {
                // 重力と減衰
                physicsState.vy -= 0.015; // 落下加速度
                physicsState.vx *= 0.92;  // 空気抵抗
                physicsState.vz *= 0.92;
                physicsState.vRotX *= 0.88;
                physicsState.vRotY *= 0.88;
                physicsState.vRotZ *= 0.88;

                physicsState.x += physicsState.vx;
                physicsState.y += physicsState.vy;
                physicsState.z += physicsState.vz;

                physicsState.rotX += physicsState.vRotX;
                physicsState.rotY += physicsState.vRotY;
                physicsState.rotZ += physicsState.vRotZ;

                // バーとの当たり判定（絶対すり抜けないカスタム床面判定）
                const groundY = 0.0; // バーの表面の高さ
                const halfSize = 1.5; // 箱の半分の幅

                if (physicsState.y - 0.75 <= groundY) {
                    // バーの上にあるか、隙間に落ちかけているかの判定
                    const mode = document.getElementById('bridgeMode').value;
                    let isSupported = true;

                    if (mode === 'parallel_h' || mode === 'suehirogari') {
                        // 左右のバーの間隔（Z軸方向）
                        const barGap = 4.0;
                        const distZ = Math.abs(physicsState.z);
                        // バーの幅の外側、または中央の隙間（Gap）に落ちたら落下
                        if (distZ < 1.0 || distZ > 2.4) {
                            isSupported = false;
                        }
                    } else if (mode === 'parallel_v') {
                        const barGap = 4.0;
                        const distX = Math.abs(physicsState.x);
                        if (distX < 1.0 || distX > 2.4) {
                            isSupported = false;
                        }
                    }

                    if (isSupported) {
                        // バーの上にしっかり乗っている場合：着地してバウンドを消す
                        physicsState.y = groundY + 0.75;
                        physicsState.vy = 0;
                        physicsState.vx *= 0.8; // 摩擦
                        physicsState.vz *= 0.8;
                    } else {
                        // 隙間に落ちた！落下フラグON
                        physicsState.isFallen = true;
                    }
                }

                // 画面外への落下
                if (physicsState.y < -5.0) {
                    physicsState.isFallen = true;
                }
            }

            // 落下確定時の演出
            if (physicsState.isFallen) {
                physicsState.y -= 0.08; // 沈んでいく
                boxGroup.children[0].material.opacity = 0.4; // 半透明化
                const com = boxGroup.getObjectByName("comMarker");
                if (com) com.visible = true; // 重心公開！

                document.getElementById('status').innerText = "🎉 落下成功！ 重心はここだった！";
                document.getElementById('status').style.color = "#ff3366";
            }

            // Three.jsメッシュへ座標を反映
            boxGroup.position.set(physicsState.x, physicsState.y, physicsState.z);
            boxGroup.rotation.set(physicsState.rotX, physicsState.rotY, physicsState.rotZ);
        }

        // --- 8. アニメーションループ ---
        function animate() {
            requestAnimationFrame(animate);
            updatePhysics();
            renderer.render(scene, camera);
        }

        // リサイズ対応
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 起動
        resetSimulation();
        animate();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ClawSight 3D - Parallel Master</title>
    <style>
        * { box-sizing: border-box; touch-action: none; }
        body { margin: 0; overflow: hidden; background-color: #0b0b0b; font-family: sans-serif; }
        
        #ui-panel {
            position: absolute; top: 10px; left: 10px; right: 10px; z-index: 100;
            background: rgba(0, 0, 0, 0.9); padding: 14px;
            border: 1px solid #00ffcc; border-radius: 12px; color: #00ffcc;
            text-align: center;
        }
        h1 { font-size: 15px; margin: 0 0 4px 0; text-transform: uppercase; letter-spacing: 1px; }
        p { font-size: 11px; margin: 0; color: #aaa; }
        #status { font-size: 13px; font-weight: bold; color: #00ffcc; margin-top: 8px; }
        
        #controls {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            z-index: 100; width: 90%; max-width: 400px;
            display: flex; gap: 10px; justify-content: space-between;
        }
        button {
            flex: 1; padding: 16px 0; font-size: 16px; font-weight: 900;
            border: none; border-radius: 8px; cursor: pointer;
            box-shadow: 0 4px 0 rgba(0,0,0,0.6);
        }
        button:active { transform: translateY(4px); box-shadow: none; }
        #btn-drop { background: #ff3366; color: #fff; border: 2px solid #ff88aa; }
        #btn-reset { background: #222; color: #00ffcc; border: 2px solid #00ffcc; flex: 0.5; }

        #target-ui {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.4); font-size: 12px; font-weight: bold; pointer-events: none; z-index: 50;
            text-align: center; text-shadow: 1px 1px 2px #000;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui-panel">
        <h1>ClawSight [Parallel Master]</h1>
        <p>平行橋渡し設定：隠された重心を突いて箱を落とせ！</p>
        <div id="status">Status: プレイ中... 重心を探れ！</div>
    </div>

    <div id="target-ui">[ スワイプでアーム位置を移動 ]</div>

    <div id="controls">
        <button id="btn-reset" onclick="resetSimulation()">RESET</button>
        <button id="btn-drop" onclick="dropArm()">DROP ARM</button>
    </div>

    <script>
        // --- 1. シーン・カメラ・レンダラー構築 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0b0b0b);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 14, 16);
        camera.lookAt(0, -1, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // --- 2. 物理・ゲーム状態の定義 ---
        let boxGroup;
        let targetMesh;
        
        let physicsState = {
            x: 0, y: 0.75, z: 0, // バーの上(y=0.75)にセット
            vx: 0, vy: 0, vz: 0,
            rotX: 0, rotY: 0, rotZ: 0,
            vRotX: 0, vRotY: 0, vRotZ: 0,
            comX: 0, comZ: 0, // 重心の偏り
            isFallen: false
        };

        // 平行バーの固定描画
        function buildStage() {
            const barMat = new THREE.MeshStandardMaterial({ color: 0x777777, roughness: 0.3 });
            // 奥のバー
            const bar1 = new THREE.Mesh(new THREE.BoxGeometry(16, 0.5, 0.5), barMat);
            bar1.position.set(0, 0, -2.0);
            scene.add(bar1);
            // 手前のバー
            const bar2 = new THREE.Mesh(new THREE.BoxGeometry(16, 0.5, 0.5), barMat);
            bar2.position.set(0, 0, 2.0);
            scene.add(bar2);
        }

        function initBox() {
            if (boxGroup) scene.remove(boxGroup);

            physicsState.x = 0;
            physicsState.y = 0.75; 
            physicsState.z = 0;
            physicsState.vx = 0; physicsState.vy = 0; physicsState.vz = 0;
            physicsState.rotX = 0; physicsState.rotY = 0; physicsState.rotZ = 0;
            physicsState.vRotX = 0; physicsState.vRotY = 0; physicsState.vRotZ = 0;
            physicsState.isFallen = false;

            // 【重心の完全ランダム化】前後左右どちらかに必ず重りが偏る
            physicsState.comX = (Math.random() - 0.5) * 1.4;
            physicsState.comZ = (Math.random() - 0.5) * 1.4;

            document.getElementById('status').innerText = "Status: プレイ中... 重心を探れ！";
            document.getElementById('status').style.color = "#00ffcc";

            boxGroup = new THREE.Group();
            
            const boxGeo = new THREE.BoxGeometry(3.0, 1.4, 3.0);
            const boxMat = new THREE.MeshStandardMaterial({ color: 0x00ffcc, roughness: 0.3, transparent: true, opacity: 1.0 });
            const mainMesh = new THREE.Mesh(boxGeo, boxMat);
            boxGroup.add(mainMesh);

            const edges = new THREE.EdgesGeometry(boxGeo);
            const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x000000 }));
            boxGroup.add(line);

            // 答え合わせ用の重心マーカー
            const comGeo = new THREE.SphereGeometry(0.3, 16, 16);
            const comMat = new THREE.MeshBasicMaterial({ color: 0xff0055 });
            const comMarker = new THREE.Mesh(comGeo, comMat);
            comMarker.name = "comMarker";
            comMarker.position.set(physicsState.comX, 0, physicsState.comZ);
            comMarker.visible = false;
            boxGroup.add(comMarker);

            scene.add(boxGroup);
        }

        function resetSimulation() {
            initBox();
        }

        // --- 3. タッチ操作によるエイム移動 ---
        const targetGeo = new THREE.RingGeometry(0.4, 0.6, 16);
        const targetMat = new THREE.MeshBasicMaterial({ color: 0xff3366, side: THREE.DoubleSide });
        targetMesh = new THREE.Mesh(targetGeo, targetMat);
        targetMesh.rotation.x = -Math.PI / 2;
        targetMesh.position.set(0, 0, 0);
        scene.add(targetMesh);

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);

        function updateTarget(event) {
            if(event.target.tagName === 'BUTTON') return;
            let clientX = event.touches ? event.touches[0].clientX : event.clientX;
            let clientY = event.touches ? event.touches[0].clientY : event.clientY;
            
            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            const targetPos = new THREE.Vector3();
            raycaster.ray.intersectPlane(plane, targetPos);
            
            if (targetPos) {
                targetMesh.position.x = Math.max(-4, Math.min(4, targetPos.x));
                targetMesh.position.z = Math.max(-4, Math.min(4, targetPos.z));
            }
        }
        window.addEventListener('touchmove', updateTarget, {passive: false});
        window.addEventListener('mousemove', updateTarget);

        // --- 4. アーム投下（重心トルク計算） ---
        function dropArm() {
            if (physicsState.isFallen) return;

            const tx = targetMesh.position.x;
            const tz = targetMesh.position.z;

            const dx = tx - physicsState.x;
            const dz = tz - physicsState.z;
            const dist = Math.sqrt(dx*dx + dz*dz);

            if (dist > 2.8) return; // 空振り

            // 重心からの距離（レバレッジ）を計算してリアルな回転トルクを生む
            const leverageX = tx - (physicsState.x + physicsState.comX);
            const leverageZ = tz - (physicsState.z + physicsState.comZ);

            physicsState.vy += 0.28; 
            physicsState.vRotX += leverageZ * 0.18; 
            physicsState.vRotZ -= leverageX * 0.18; 
            physicsState.vx += leverageX * 0.1;
            physicsState.vz += leverageZ * 0.1;
        }

        // --- 5. 物理演算と隙間判定（平行専用・最適化版） ---
        function updatePhysics() {
            if (!boxGroup) return;

            if (!physicsState.isFallen) {
                physicsState.vy -= 0.012; 
                physicsState.vx *= 0.85;  
                physicsState.vz *= 0.85;
                physicsState.vRotX *= 0.82;
                physicsState.vRotY *= 0.82;
                physicsState.vRotZ *= 0.82;

                physicsState.x += physicsState.vx;
                physicsState.y += physicsState.vy;
                physicsState.z += physicsState.vz;

                physicsState.rotX += physicsState.vRotX;
                physicsState.rotY += physicsState.vRotY;
                physicsState.rotZ += physicsState.vRotZ;

                const groundY = 0.75; 

                if (physicsState.y <= groundY) {
                    // 平行バーの隙間判定（Z軸方向：中央の隙間 0.8 ~ 2.2 を外れたら落下）
                    const distZ = Math.abs(physicsState.z);
                    const isSupported = (distZ >= 0.8 && distZ <= 2.2);

                    if (isSupported) {
                        physicsState.y = groundY;
                        physicsState.vy = 0;
                        physicsState.vx *= 0.7; 
                        physicsState.vz *= 0.7;
                    } else {
                        physicsState.isFallen = true;
                    }
                }

                if (physicsState.y < -5.0) {
                    physicsState.isFallen = true;
                }
            }

            // リザルト演出（答え合わせ）
            if (physicsState.isFallen) {
                physicsState.y -= 0.08; 
                boxGroup.children[0].material.opacity = 0.4; 
                const com = boxGroup.getObjectByName("comMarker");
                if (com) com.visible = true; 

                document.getElementById('status').innerText = "🎉 落下成功！ 重心はここだった！";
                document.getElementById('status').style.color = "#ff3366";
            }

            boxGroup.position.set(physicsState.x, physicsState.y, physicsState.z);
            boxGroup.rotation.set(physicsState.rotX, physicsState.rotY, physicsState.rotZ);
        }

        function animate() {
            requestAnimationFrame(animate);
            updatePhysics();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 初期化実行
        buildStage();
        initBox();
        animate();
    </script>
</body>
</html>

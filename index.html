<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ClawSight Engine v2.0</title>
    <style>
        * { box-sizing: border-box; touch-action: manipulation; }
        body {
            margin: 0; padding: 0;
            background-color: #121212; color: #00ffcc;
            font-family: sans-serif; overflow: hidden;
            display: flex; flex-direction: column; align-items: center;
        }
        #ui-panel {
            position: absolute; top: 10px; left: 10px; right: 10px; z-index: 100;
            background: rgba(0, 0, 0, 0.85); padding: 12px;
            border: 1px solid #00ffcc; border-radius: 8px;
        }
        h1 { font-size: 14px; margin: 0 0 4px 0; color: #00ffcc; text-transform: uppercase; }
        p { font-size: 11px; margin: 0 0 6px 0; color: #aaa; line-height: 1.2; }
        
        /* モード選択UI */
        .mode-select { margin-bottom: 8px; width: 100%; }
        select { 
            width: 100%; padding: 6px; background: #222; color: #00ffcc; 
            border: 1px solid #00ffcc; border-radius: 4px; font-size: 12px; font-weight: bold;
        }

        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        button {
            background: #00ffcc; color: #000; border: none;
            padding: 12px 6px; font-size: 12px; font-weight: bold;
            border-radius: 4px; cursor: pointer;
        }
        button:active { background: #00b38f; }
        button.reset { background: #ff3366; color: #fff; grid-column: span 2; }
        
        #status { font-size: 13px; font-weight: bold; color: #00ffcc; margin-top: 8px; text-align: center; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>

    <div id="ui-panel">
        <h1>ClawSight Engine v2.0</h1>
        <p>重心を推測して落とせ！見事落とせば答え合わせだ。</p>
        
        <div class="mode-select">
            <select id="bridgeMode" onchange="resetGame()">
                <option value="parallel_h">設定1：平行・横向き（画面左右）</option>
                <option value="parallel_v">設定2：直線・縦向き（画面上下）</option>
                <option value="suehirogari">設定3：末広がり（右側が広い）</option>
            </select>
        </div>

        <div class="btn-grid">
            <button onclick="applyArmForce(-30, -70, -1.0, 2.0)">左奥を狙う</button>
            <button onclick="applyArmForce(30, -70, 1.0, 2.0)">右奥を狙う</button>
            <button onclick="applyArmForce(-30, 70, -1.5, -2.5)">左手前を狙う</button>
            <button onclick="applyArmForce(30, 70, 1.5, -2.5)">右手前を狙う</button>
            <button class="reset" onclick="resetGame()">新しい箱をセット (重心リセット)</button>
        </div>
        <div id="status">Status: プレイ中...重心を探れ！</div>
    </div>

    <canvas id="simCanvas"></canvas>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // --- 物理パラメータ ---
        const barGap = 130;   
        const barWidth = 16;
        const barLength = 800; 

        let box = {
            x: 0, y: 0,
            vx: 0, vy: 0,
            angle: 0,       
            angularVel: 0, 
            width: 180,  
            height: 90,  
            comX: 0,    
            comY: 0,    
            isFallen: false,
            showCom: false // 重心の可視化フラグ
        };

        function resetGame() {
            box.x = window.innerWidth / 2;
            box.y = window.innerHeight / 2;
            box.vx = 0; box.vy = 0;
            box.angularVel = 0;
            box.isFallen = false;
            box.showCom = false;

            const mode = document.getElementById('bridgeMode').value;
            if (mode === 'parallel_h' || mode === 'suehirogari') {
                box.angle = Math.PI / 2; // 縦向きに置く
            } else {
                box.angle = 0; // 横向きに置く
            }

            // 【ハックポイント】重心の完全ランダム化
            // 幅の±60px、高さの±30pxの範囲でランダムな偏りを作る
            box.comX = (Math.random() - 0.5) * 120;
            box.comY = (Math.random() - 0.5) * 60;

            const statusEl = document.getElementById('status');
            statusEl.innerText = "Status: プレイ中...重心を探れ！";
            statusEl.style.color = "#00ffcc";
        }

        function applyArmForce(localX, localY, forceX, forceY) {
            if (box.isFallen) return;
            const cos = Math.cos(box.angle);
            const sin = Math.sin(box.angle);
            const rx = (localX - box.comX) * cos - (localY - box.comY) * sin;
            const ry = (localX - box.comX) * sin + (localY - box.comY) * cos;
            const fx = forceX * cos - forceY * sin;
            const fy = forceX * sin + forceY * cos;
            const torque = rx * fy - ry * fx;

            box.angularVel += torque * 0.0008; 
            box.vx += fx * 0.8;
            box.vy += fy * 0.8;
        }

        function updatePhysics() {
            if (box.isFallen) return;

            box.x += box.vx;
            box.y += box.vy;
            box.angle += box.angularVel;

            box.vx *= 0.88;
            box.vy *= 0.88;
            box.angularVel *= 0.85;

            const cx = window.innerWidth / 2;
            const cy = window.innerHeight / 2;
            const mode = document.getElementById('bridgeMode').value;

            const absCos = Math.abs(Math.cos(box.angle));
            const absSin = Math.abs(Math.sin(box.angle));
            
            let effectiveSize;
            let currentGap = barGap;
            let distanceToCenter;

            // モード別の動的落下判定
            if (mode === 'parallel_h') {
                effectiveSize = box.height * absCos + box.width * absSin;
                distanceToCenter = Math.abs(box.y - cy);
            } else if (mode === 'parallel_v') {
                effectiveSize = box.width * absCos + box.height * absSin;
                distanceToCenter = Math.abs(box.x - cx);
            } else if (mode === 'suehirogari') {
                effectiveSize = box.height * absCos + box.width * absSin;
                distanceToCenter = Math.abs(box.y - cy);
                // X座標に応じて隙間が広がる（右に行くほど広くなる）
                // 画面中心から100px右に行くごとに隙間が20px広がる計算
                currentGap = barGap + ((box.x - cx) / 100) * 20; 
            }

            // 落下処理＆答え合わせ
            if (effectiveSize < currentGap + 10 || distanceToCenter > currentGap) {
                box.isFallen = true;
                box.showCom = true; // 落下時に重心を公開！
                
                const statusEl = document.getElementById('status');
                statusEl.innerText = "🎉 落下成功！ 重心はここだった！";
                statusEl.style.color = "#ff0055";
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            const mode = document.getElementById('bridgeMode').value;

            // バーの描画
            ctx.strokeStyle = '#666666';
            ctx.lineWidth = barWidth;
            ctx.lineCap = 'round';
            ctx.beginPath();

            if (mode === 'parallel_h') {
                ctx.moveTo(cx - barLength/2, cy - barGap/2); ctx.lineTo(cx + barLength/2, cy - barGap/2);
                ctx.moveTo(cx - barLength/2, cy + barGap/2); ctx.lineTo(cx + barLength/2, cy + barGap/2);
            } else if (mode === 'parallel_v') {
                ctx.moveTo(cx - barGap/2, cy - barLength/2); ctx.lineTo(cx - barGap/2, cy + barLength/2);
                ctx.moveTo(cx + barGap/2, cy - barLength/2); ctx.lineTo(cx + barGap/2, cy + barLength/2);
            } else if (mode === 'suehirogari') {
                // 左が狭く、右が広い八の字
                ctx.moveTo(cx - barLength/2, cy - barGap/2 + 40); ctx.lineTo(cx + barLength/2, cy - barGap/2 - 60);
                ctx.moveTo(cx - barLength/2, cy + barGap/2 - 40); ctx.lineTo(cx + barLength/2, cy + barGap/2 + 60);
            }
            ctx.stroke();

            // 箱の描画
            ctx.save();
            ctx.translate(box.x, box.y);
            ctx.rotate(box.angle);

            if (box.isFallen) {
                ctx.globalAlpha = 0.4; 
                ctx.scale(0.85, 0.85);  
            }

            ctx.fillStyle = '#00ffcc';
            ctx.fillRect(-box.width/2, -box.height/2, box.width, box.height);
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 2;
            ctx.strokeRect(-box.width/2, -box.height/2, box.width, box.height);

            // 【ハックポイント】重心の公開
            if (box.showCom) {
                ctx.globalAlpha = 1.0; // 箱が半透明でも重心はクッキリ見せる
                ctx.fillStyle = '#ff0055';
                ctx.beginPath();
                ctx.arc(box.comX, box.comY, 14, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.stroke();
            }

            ctx.restore();

            updatePhysics();
            requestAnimationFrame(draw);
        }

        resetGame();
        draw();
    </script>
</body>
</html>
